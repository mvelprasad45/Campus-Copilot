<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Copilot - Login History</title>
<script src="{{ url_for('static', filename='theme.js') }}"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <div class="logo">Campus Copilot - Login History</div>
  <div class="topbar-user">
    <a href="/admin/dashboard" class="ghost-link">Dashboard</a>
    <button id="admin-logout-btn" class="ghost">Log Out</button>
  </div>
</header>

<main class="admin-layout">
  <section class="card">
    <div class="card-header-row">
      <h3>Successful logins</h3>
      <button id="clear-filters-btn" class="ghost-dark" type="button">Clear filters</button>
    </div>
    <form id="history-filters" class="filter-row">
      <input id="history-email" type="search" placeholder="Search by email">
      <select id="history-user-type">
        <option value="">All users</option>
        <option value="student">Students</option>
        <option value="admin">Admins</option>
      </select>
      <input id="history-date" type="date">
      <button class="primary" type="submit">Filter</button>
    </form>
    <div class="table-wrap">
      <table>
        <thead><tr><th>User</th><th>Email</th><th>Login time</th><th>IP address</th><th>Browser</th><th>Operating system</th></tr></thead>
        <tbody id="login-history-list"></tbody>
      </table>
    </div>
    <p id="history-empty" class="hidden">No login records found.</p>
  </section>
</main>
<script src="{{ url_for('static', filename='admin_login_history.js') }}"></script>
</body>
</html>
